[project]
name = "mtproto-platform"
version = "0.1.0"
description = "Empirical discovery, validation, measurement and scoring of public MTProto proxies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Core runtime (Task 001) ---
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # --- Database layer (Task 002) ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.28.1",
    "telethon>=1.35.0",
    # --- HTTP ranking API (Task 007) ---
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
mtproto-discovery = "workers.discovery:main"
mtproto-tester = "workers.tester:main"
mtproto-scorer = "workers.scorer:main"
mtproto-api = "workers.api:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/modules", "src/workers"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a real local PostgreSQL instance (DATABASE_URL)",
    "live: performs real network I/O against public endpoints; never runs in CI",
    "stress: long-running resource/leak stress test; opt-in via -m stress",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["spike", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "S",   # flake8-bandit (secrets / unsafe calls)
    "ASYNC", # flake8-async
]
ignore = [
    "S101", # assert is expected in tests
    "B008", # function call in default argument (used by SQLAlchemy/FastAPI-style DI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "workers"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
exclude = ['^spike/', '^alembic/versions/']
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "telethon",
    "telethon.*",
]
ignore_missing_imports = true


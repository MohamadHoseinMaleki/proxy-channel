# Alembic configuration.
#
# NOTE: there is deliberately NO `sqlalchemy.url` here. The DSN carries
# credentials and must never live in a tracked file. alembic/env.py resolves it
# from core.config.Settings (i.e. DATABASE_URL / .env), in this order:
#
#   1. `alembic -x url=postgresql+asyncpg://...`   (explicit override)
#   2. `alembic -x test=1`                         (use the *_test database)
#   3. Settings.database_url                       (DATABASE_URL / .env)
#
# Logging is also handled by env.py via core.logger.configure_logging, so there
# are no [loggers]/[handlers]/[formatters] sections here: letting Alembic's
# fileConfig() run would clobber the structured logging set up in Task 001.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# Deterministic, zero-padded, sortable revision filenames.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Keep generated migrations lint-clean automatically. Requires ruff on PATH;
# `uv run alembic ...` satisfies that. Comment out if ruff is unavailable.
hooks = ruff_format, ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

[project]
name = "mtproto-platform"
version = "0.1.0"
description = "MTProto Proxy Intelligence and Distribution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.1",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.1",
    "sqlalchemy>=2.0.38",
    "structlog>=25.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]